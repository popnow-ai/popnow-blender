name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and smoke tests (fake bpy, fake PopNow server, no network)
        run: python -m unittest discover -s tests -v
      - name: Build the add-on zip
        run: python scripts/build_zip.py
